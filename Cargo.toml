# The platform's thin entry point: one package, whose library finds the unit that carries a command and whose
# binary `bmo` hands the command to it. Its tests stand in `tests/`.
[package]
name = "bmo-cli"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "bmo_cli"
path = "src/lib.rs"
test = false

[[bin]]
name = "bmo"
path = "src/main.rs"
test = false

[dependencies]
clap = { version = "4.5.40", default-features = false, features = ["std", "derive", "error-context", "usage"] }
inventory = "0.3.24"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
ureq = { version = "3.1", default-features = false, features = ["json"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tempfile = "3.20.0"
tokio = { version = "1.53.2", features = ["net", "rt", "sync"] }
