# How bmo-testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.
testbed = 0
name = "bmo-cli"

[test]
languages = ["cargo"]

[check]
quick = ["layout", "dependencies", "korean", "dashes", "cargo-profile"]
# The text a person reads: the literals of the binary.
people_text = ["src/**/*.rs"]
# No code file holds Korean, so the ledger allows none anywhere.
korean_ledger = "korean-ledger.json"
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui"]

[build]
binaries = ["bmo"]

# The binary goes into a release's bin/ in a deploy tree of its own. It runs no service, so the
# deployment starts no unit.
[deploy]
root = "~/.local/share/bmo-cli"
data_root = "~/.local/share/bmo-cli/data"
units = []

# The binary, linked into `.local/bin` under the home directory, where every program whose `PATH` holds that
# folder finds `bmo` by its bare name and every unit command linked beside it (docs/api.md, "Where `bmo`
# stands"). The link names this repository's deploy tree, whose own link stands across releases; a link made to
# the release being deployed would dangle once a later deployment prunes that release.
[[deploy.step]]
id = "link-command"
phase = "before-flip"
command = '''
set -eu
mkdir -p "$HOME/.local/bin"
ln -sfn "$HOME/.local/share/bmo-cli/deploy/bin/bmo" "$HOME/.local/bin/bmo"
'''
